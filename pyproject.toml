[project]
name = "mcp-de-picnic"
version = "0.1.0"
description = "Unofficial MCP server for the Picnic grocery delivery API (NL/DE) — raw HTTP calls, no third-party Picnic wrapper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "aminm1364" }]
keywords = ["mcp", "picnic", "grocery"]
dependencies = [
    "mcp>=2.0.0,<3",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/aminm1364/mcp-de-picnic"

[project.scripts]
mcp-de-picnic = "mcp_de_picnic.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_de_picnic"]
